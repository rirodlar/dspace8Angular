<div class="home-news-container mt-ncs" style="background-color: #E9ECEF !important; border-bottom: 2px #CF4444 solid">
  <div class="container">

    <div class="jumbotron jumbotron-fluid"  style="padding:1px;padding-top:12px;">
      <ds-text-section *ngIf="hasHomeNewsMetadata; else dsDefaultHomeNews" [sectionId]="'site'" [textRowSection]="homeNewsSection"
                              [site]="(site$ | async)"></ds-text-section>
    </div>
  </div>
</div>

<ng-template #dsDefaultHomeNews>
  <div class="text-center">
    <h1>Sistema de Información Científica USACH</h1>
    <p class="mb-0" style="color: #343A40;">Nota: se encuentra en proceso de mejora continua. Algunas secciones pueden presentar cambios o estar en construcción</p>
  </div>
</ng-template>
